name: '[ci][workflow-call][gh-linux] Browser'

on:
  workflow_call:
    inputs:
      request:
        required: true
        type: string
      core_sha:
        required: true
        type: string
      tested_sha:
        required: true
        type: string
    secrets:
      CORE_READ_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'

jobs:
  browser-ui:
    permissions:
      contents: read
      actions: read
    name: Browser UI (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: source
    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notehub-core
          skip-token-revoke: true
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notehub-core
          ref: ${{ inputs.core_sha }}
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: ci
          source-sha: ${{ inputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}
          control-sha: ${{ inputs.core_sha }}

      - name: Ensure core metadata token revoked
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: |
          if [ -f "$RUNNER_TEMP/notehub-core-metadata-revoked" ]; then
            exit 0
          fi
          status=$(printf 'header = "Authorization: Bearer %s"\n' "$CORE_TOKEN" | \
            curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
              --request DELETE --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' --config - \
              https://api.github.com/installation/token)
          test "$status" = 204

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ inputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ hashFiles('source/frontend/package.json') != '' && 'source/frontend/package.json' || 'source/package.json' }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ hashFiles('source/frontend/.node-version') != '' && 'source/frontend/.node-version' || 'source/.node-version' }}
          package-manager-cache: false

      - name: Install dependencies
        shell: private_run.sh {0}
        run: pnpm --dir "${{ hashFiles('source/frontend/pnpm-workspace.yaml') != '' && 'frontend' || '.' }}" install --frozen-lockfile

      - name: Install Chromium
        shell: private_run.sh {0}
        run: pnpm --dir "${{ hashFiles('source/frontend/pnpm-workspace.yaml') != '' && 'frontend' || '.' }}" --filter web exec playwright install --with-deps chromium

      - name: Start frontend without API or external services
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_browser_ui_start.sh"

      - name: Test browser UI without external services
        id: browser_tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/browser-ui-test-results.json
          BROWSER_UI_SHARD: ${{ matrix.shard }}/3
        shell: private_run.sh {0}
        run: pnpm --dir "${{ hashFiles('source/frontend/pnpm-workspace.yaml') != '' && 'frontend' || '.' }}" --filter web test:e2e --project=desktop-chromium --shard="$BROWSER_UI_SHARD" --reporter=dot,json

      - name: Collect browser UI test timings
        id: browser_timings
        if: ${{ steps.worker.outcome == 'success' && (!cancelled() && (steps.browser_tests.outcome == 'success' || steps.browser_tests.outcome == 'failure')) }}
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_browser_ui_timings.sh"

      - name: Retain browser UI test timings
        if: ${{ steps.worker.outcome == 'success' && (!cancelled() && steps.browser_timings.outcome == 'success') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-ui-test-timings-${{ matrix.shard }}
          path: source/browser-e2e/browser-test-timings.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload login UI screenshots
        if: ${{ steps.worker.outcome == 'success' && (always()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: login-ui-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: source/frontend/web/test-results/login-*.png

      - name: Upload authentication UI screenshots
        if: ${{ steps.worker.outcome == 'success' && (always()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authentication-ui-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: source/frontend/web/test-results/settings-auth-*.png

      - name: Upload revision UI screenshots
        if: ${{ steps.worker.outcome == 'success' && (always()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: text-revisions-ui-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: source/frontend/web/test-results/text-revisions-*.png

      - name: Upload trash UI screenshots
        if: ${{ steps.worker.outcome == 'success' && (always()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trash-ui-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: source/frontend/web/test-results/trash-*.png

      - name: Upload history and action dialog UI screenshots
        if: ${{ steps.worker.outcome == 'success' && (always()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invocation-history-ui-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            source/frontend/web/test-results/invocation-history-*.png
            source/frontend/web/test-results/dialog-*.png
