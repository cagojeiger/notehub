name: "[ci][core-request][gh-linux] Build & Test"
run-name: Core ci ${{ fromJSON(inputs.request).request.run_id }}.${{ fromJSON(inputs.request).request.attempt }} ${{ fromJSON(inputs.request).request.tested_sha }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Validated core workflow run and immutable source request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: core-ci-${{ fromJSON(inputs.request).request.event == 'pull_request' && format('pr-{0}', fromJSON(inputs.request).request.pr_number) || format('run-{0}', fromJSON(inputs.request).request.run_id) }}
  cancel-in-progress: ${{ fromJSON(inputs.request).request.event == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  gate:
    name: Request
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/request.yml
    with:
      request: ${{ inputs.request }}
      kind: ci
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  source:
    name: Source Checks
    needs: [gate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/source-checks.yml
    with:
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
      checks: ${{ toJSON(needs.gate.outputs) }}
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  rust-lint:
    name: Rust Lint
    needs: [gate]
    if: needs.gate.outputs.rust == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rust.yml
    with:
      core: notehub-core
      task: lint
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  rust-build:
    name: Rust Build
    needs: [gate]
    if: needs.gate.outputs.rust == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rust.yml
    with:
      core: notehub-core
      task: build
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  rust-api:
    name: Rust API
    needs: [gate]
    if: needs.gate.outputs.rust_build == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rust.yml
    with:
      core: notehub-core
      task: api
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
      browser: ${{ needs.gate.outputs.browser == 'true' }}
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  postgres18:
    name: PostgreSQL 18
    needs: [gate]
    if: needs.gate.outputs.postgres == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rust.yml
    with:
      core: notehub-core
      task: postgres18
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  rust-audit:
    name: RustSec Audit
    needs: [gate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rust.yml
    with:
      core: notehub-core
      task: audit
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  web:
    name: Web
    needs: [gate]
    if: needs.gate.outputs.web == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/web.yml
    with:
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  image:
    name: Image
    needs: [gate]
    if: needs.gate.outputs.image == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/image.yml
    with:
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  browser-ui:
    name: Browser UI
    needs: [gate]
    if: needs.gate.outputs.browser == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/browser.yml
    with:
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  npm-audit:
    name: Npm Audit
    needs: [gate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/npm-audit.yml
    with:
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
    secrets:
      CORE_READ_APP_PRIVATE_KEY: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}

  result:
    name: Result
    if: always()
    needs: [gate, source, rust-lint, rust-build, rust-api, postgres18, rust-audit, web, image, browser-ui, npm-audit]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout public result contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github
      - name: Require all selected checks to complete
        env:
          CI_KIND: ci
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -I -B .github/scripts/check_ci_result.py
