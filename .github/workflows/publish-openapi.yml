name: "[docs][deploy-verified][gh-linux] Publish OpenAPI"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Verified deployment version without the v prefix"
        required: true
        type: string
      image_commitment:
        description: "SHA-256 of the verified deployment image reference"
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    env:
      DEPLOYED_VERSION: ${{ inputs.version }}
      IMAGE_COMMITMENT: ${{ inputs.image_commitment }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export OpenAPI from the verified release image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$IMAGE_COMMITMENT" =~ ^[0-9a-f]{64}$ ]]
          gh release view "v$DEPLOYED_VERSION" --json tagName,isDraft,isPrerelease |
            jq -e --arg tag "v$DEPLOYED_VERSION" '.tagName == $tag and (.isDraft or .isPrerelease | not)' >/dev/null
          export DOCKER_CONFIG="$RUNNER_TEMP/openapi-docker"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="ghcr.io/cagojeiger/notehub:$DEPLOYED_VERSION"
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          read -r observed_commitment _ < <(printf '%s' "$image@$digest" | sha256sum)
          if [[ "$observed_commitment" != "$IMAGE_COMMITMENT" ]]; then
            echo 'The release image does not match the verified deployment.' >&2
            exit 1
          fi
          docker pull "$image@$digest" >/dev/null
          docker run --rm --pull=never --network none --read-only \
            --entrypoint /usr/local/bin/notegate-api "$image@$digest" --print-openapi \
            > "$RUNNER_TEMP/openapi-v2.json"

      - name: Publish the version and update the latest link
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-openapi.sh "$DEPLOYED_VERSION" "$RUNNER_TEMP/openapi-v2.json"
