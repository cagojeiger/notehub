name: "[ci][pr·main][gh-linux] Workflow Validation"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout public workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require explicit Ubuntu runner versions
        shell: bash
        run: |
          floating_label='ubuntu-'"latest"
          if git grep -nF "$floating_label" -- .github/workflows; then
            echo '::error::Use an explicit Ubuntu runner version'
            exit 1
          else
            test "$?" -eq 1
          fi

      - name: Validate workflow syntax with official actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

      - name: Set up Node for temporary browser installation proof
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Install isolated browser tooling
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/browser-install-proof" --ignore-scripts --no-audit --no-fund @playwright/test@1.64.1

      - name: Reproduce browser installation without application sources
        shell: bash
        run: '"$RUNNER_TEMP/browser-install-proof/node_modules/.bin/playwright" install --with-deps chromium'
